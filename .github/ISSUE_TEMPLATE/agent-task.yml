name: Agent task
description: Task đủ rõ để AI agent lập plan hoặc implement
title: "[Agent] "
labels: ["agent:audit"]
body:
  - type: markdown
    attributes:
      value: |
        Dùng template này để tạo task cho Agent A/B/C/D. Agent implement chỉ nên chạy khi issue đã đủ Definition of Ready.
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề / cơ hội
      description: User đang gặp gì, hoặc sản phẩm cần cải thiện gì?
      placeholder: "Ví dụ: Người dùng vào homepage nhưng không đăng ký vì signup benefit chưa rõ."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Bằng chứng
      description: Analytics, feedback, ảnh chụp, log, file liên quan.
      placeholder: "Page, metric, user quote, hoặc link."
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Phạm vi
      description: Nêu rõ trong scope và ngoài scope.
      placeholder: "Trong scope: homepage copy + register CTA. Ngoài scope: payment/VIP."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Điều kiện để xem là xong.
      placeholder: |
        - [ ] EN/VI đều có copy mới.
        - [ ] Register CTA nêu lợi ích cụ thể.
        - [ ] npm run lint pass.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Rủi ro / quyết định cần người duyệt
      placeholder: "Compliance, SEO, payment, data privacy, brand tone..."
    validations:
      required: false

