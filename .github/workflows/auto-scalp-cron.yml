name: Auto-Scalp Cron

on:
  schedule:
    # Chạy mỗi 5 phút — GitHub Actions thay Vercel cron (Hobby plan giới hạn daily)
    - cron: "*/5 * * * *"
  workflow_dispatch: # Cho phép chạy thủ công từ GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 2
    steps:
      - name: Trigger auto-scalp endpoint
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/scalping/auto-run" \
            || echo "Request failed (no active configs or endpoint error)"
