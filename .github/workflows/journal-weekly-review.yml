name: Journal Weekly Review

on:
  schedule:
    # Chủ Nhật 22:00 UTC = Thứ Hai 05:00 ICT — sau khi tuần kết thúc
    - cron: "0 22 * * 0"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Trigger weekly journal review
        run: |
          curl -sf -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/journal/weekly-review/run" \
            || echo "Request failed (no eligible users or endpoint error)"
