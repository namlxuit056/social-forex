name: Agent Label Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check agent PR safety markers
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref || "";
            const body = pr.body || "";
            const isAgentBranch = branch.startsWith("codex/") || branch.startsWith("agent/");

            if (!isAgentBranch) {
              core.info("Not an agent branch; skipping agent guard.");
              return;
            }

            const required = [
              "## Summary",
              "## Tests",
              "## Agent Safety Checklist",
            ];
            const missing = required.filter((item) => !body.includes(item));

            if (missing.length > 0) {
              core.setFailed(`Agent PR is missing required sections: ${missing.join(", ")}`);
              return;
            }

            core.info("Agent PR safety sections present.");

