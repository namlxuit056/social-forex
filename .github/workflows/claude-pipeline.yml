name: Claude Dev Pipeline

on:
  issues:
    types: [labeled]

jobs:
  plan:
    # Trigger khi issue được gán label "ready-to-plan"
    if: github.event.label.name == 'ready-to-plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Planner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          STORY="${{ github.event.issue.title }}: ${{ github.event.issue.body }}"
          ./scripts/01-plan.sh "$STORY"
          ./scripts/02-create-tasks.sh

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plan-issue-${{ github.event.issue.number }}
          path: |
            plan.md
            tasks.json
            task-board.md

      - name: Comment plan on issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan.md', 'utf8');
            const tasks = JSON.parse(fs.readFileSync('tasks.json', 'utf8'));
            const taskList = tasks.tasks.map(t =>
              `- **${t.id}** (${t.estimate_hours}h): ${t.title}`
            ).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Plan từ Claude Planner\n\n${plan}\n\n## Task List\n\n${taskList}`
            });

            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              name: 'ready-to-plan'
            }).catch(() => {});

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['planned']
            });
